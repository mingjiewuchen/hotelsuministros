<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Página en construcción | Hotel Suministros</title>

<meta name="description" content="Proveedor de suministros hoteleros en Costa Rica. Página en construcción.">

<style>
body{
  margin:0;
  font-family: Arial, sans-serif;
  background:#f5f5f5;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  text-align:center;
}

.container{
  max-width:520px;
  padding:30px;
  background:white;
  border-radius:12px;
  box-shadow:0 5px 20px rgba(0,0,0,0.1);
}

.logo{
  width:180px;
  margin-bottom:15px;
}

.main-image{
  width:180px;
  margin:15px 0 20px 0;
}

h1{
  font-size:26px;
  color:#333;
  margin-bottom:10px;
}

p{
  color:#666;
  font-size:16px;
  line-height:1.6;
}

.whatsapp-btn{
  display:inline-block;
  margin-top:20px;
  padding:12px 22px;
  background:#25D366;
  color:white;
  text-decoration:none;
  border-radius:6px;
  font-size:16px;
  transition:0.3s;
}

.whatsapp-btn:hover{
  background:#1ebe5d;
}
</style>
</head>

<body>

<div class="container">

  <!-- Logo -->
  <img src="/images/logo hs.png" alt="Hotel Suministros" class="logo">

  <h1>Próximamente</h1>

  <p>
    Estamos preparando algo especial para usted.<br>

  </p>

  </p>

  <!-- WhatsApp按钮（记得改号码） -->
  <a class="whatsapp-btn" 
     href="https://wa.me/50685664622?text=Hola,%20me%20interesa%20información%20sobre%20sus%20productos"

    Contactar por WhatsApp
  </a>

</div>

</html>
