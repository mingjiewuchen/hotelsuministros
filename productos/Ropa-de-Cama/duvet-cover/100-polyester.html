<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Duvet Cover – 100% Polyester</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="../../../styles.css">

  <style>
    .producto-detalle {
      display: flex;
      gap: 30px;
      padding: 40px;
    }

    /* 左侧图片 */
    .producto-imagen {
      flex: 1;
    }

    .producto-imagen img {
      width: 100%;
      max-width: 450px;
      border-radius: 6px;
    }

    /* 右侧信息 */
    .producto-info {
      flex: 1;
    }

    .producto-info h1 {
      margin-bottom: 10px;
    }

    .descripcion {
      margin-bottom: 20px;
    }

    /* Medidas */
    .opciones h3 {
      margin-bottom: 10px;
    }

    .medidas {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    .medidas button {
      padding: 10px 16px;
      border: 1px solid #ccc;
      background-color: #f2f2f2;
      cursor: pointer;
      border-radius: 4px;
      font-weight: bold;
      color: #007bff; /* 蓝色字体 */
    }

    .medidas button.activo {
      background-color: #cfe2ff;
      border-color: #007bff;
    }

    .medida-texto {
      margin-bottom: 20px;
      font-style: italic;
    }

    /* Cantidad */
    .cantidad {
      margin-bottom: 20px;
    }

    .cantidad input {
      width: 80px;
      padding: 6px;
    }

    /* WhatsApp */
    .btn-whatsapp {
      display: inline-block;
      background-color: #25d366;
      color: white;
      padding: 12px 20px;
      border-radius: 4px;
      text-decoration: none;
      font-weight: bold;
    }

    .btn-whatsapp:hover {
      background-color: #1ebe5d;
    }

    @media (max-width: 768px) {
      .producto-detalle {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

  <!-- NAVBAR（使用你之前的版本） -->
  <header>
    <nav class="navbar">
      <a href="../../../index.html" class="logo">Hotel Suministros</a>
      <ul class="nav-links">
        <li><a href="../../../productos.html">Productos</a></li>
        <li><a href="../../../contacto.html">Contacto</a></li>
      </ul>
    </nav>
  </header>

  <main class="producto-detalle">

    <!-- Imagen -->
    <div class="producto-imagen">
      <img src="../../../images/duvet-100-polyester.jpg" alt="Duvet Cover 100% Polyester">
    </div>

    <!-- Información -->
    <div class="producto-info">
      <h1>Duvet Cover – 100% Polyester</h1>

      <p class="descripcion">
        Duvet cover fabricado en 100% polyester, resistente, fácil de lavar y ideal para hoteles y Airbnb.
      </p>

      <!-- Medidas -->
      <div class="opciones">
        <h3>Seleccionar medida</h3>

        <div class="medidas">
          <button onclick="seleccionarMedida('Twin', '170cm Ancho x 234cm Largo', this)">Twin</button>
          <button onclick="seleccionarMedida('Full', '208cm Ancho x 234cm Largo', this)">Full</button>
          <button onclick="seleccionarMedida('Queen', '230cm Ancho x 240cm Largo', this)">Queen</button>
          <button onclick="seleccionarMedida('King', '277cm Ancho x 240cm Largo', this)">King</button>
        </div>

        <div id="medidaTexto" class="medida-texto">
          Seleccione una medida
        </div>
      </div>

      <!-- Cantidad -->
      <div class="cantidad">
        <h3>Cantidad</h3>
        <input type="number" id="cantidad" min="1" value="1">
      </div>

      <!-- WhatsApp -->
      <a href="#" id="whatsappLink" class="btn-whatsapp" target="_blank">
        Enviar consulta por WhatsApp
      </a>
    </div>

  </main>

  <script>
    let medidaSeleccionada = '';

    function seleccionarMedida(nombre, texto, boton) {
      medidaSeleccionada = nombre + ' (' + texto + ')';
      document.getElementById('medidaTexto').innerText = texto;

      document.querySelectorAll('.medidas button').forEach(btn => {
        btn.classList.remove('activo');
      });
      boton.classList.add('activo');

      actualizarWhatsapp();
    }

    function actualizarWhatsapp() {
      const cantidad = document.getElementById('cantidad').value;
      const mensaje = `Hola, me interesa el producto:\n\nDuvet Cover – 100% Polyester\nMedida: ${medidaSeleccionada}\nCantidad: ${cantidad}`;
      const url = `https://wa.me/506XXXXXXXX?text=${encodeURIComponent(mensaje)}`;
      document.getElementById('whatsappLink').href = url;
    }

    document.getElementById('cantidad').addEventListener('change', actualizarWhatsapp);
  </script>

</body>
</html>
