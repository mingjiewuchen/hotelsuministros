<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Protector de Almohada Bambú | Hotel Suministros</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f5f5;
        }

        a {
            text-decoration: none;
            color: #333;
        }

        /* ===== Layout ===== */
        .container {
            display: flex;
            max-width: 1200px;
            margin: 20px auto;
            gap: 20px;
        }

        /* ===== Left Sidebar ===== */
        .sidebar {
            width: 260px;
            background: #fff;
            padding: 20px;
            border-radius: 6px;
        }

        .sidebar h3 {
            margin-top: 0;
            font-size: 18px;
            border-bottom: 1px solid #ddd;
            padding-bottom: 10px;
        }

        .sidebar ul {
            list-style: none;
            padding-left: 0;
        }

        .sidebar li {
            margin: 10px 0;
        }

        .sidebar li ul {
            margin-left: 15px;
            margin-top: 8px;
        }

        /* ===== Main Content ===== */
        .content {
            flex: 1;
            background: #fff;
            padding: 30px;
            border-radius: 6px;
        }

        .back-link {
            margin-bottom: 15px;
            display: inline-block;
            font-size: 14px;
        }

        .product {
            display: flex;
            gap: 30px;
        }

        /* ===== Product Image ===== */
        .product img {
            width: 33%;
            max-width: 320px;
            border-radius: 6px;
        }

        /* ===== Product Info ===== */
        .product-info h1 {
            margin-top: 0;
            font-size: 24px;
        }

        .measure {
            margin-top: 20px;
        }

        .measure label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        .measure select,
        .measure input[type="number"] {
            width: 220px;
            padding: 8px;
            font-size: 15px;
        }

        /* ===== Button ===== */
        .btn {
            margin-top: 25px;
            display: inline-block;
            padding: 12px 25px;
            background: #000;
            color: #fff;
            border-radius: 4px;
            font-size: 15px;
        }

        .btn:hover {
            background: #333;
        }

        @media (max-width: 900px) {
            .container {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
            }

            .product {
                flex-direction: column;
            }

            .product img {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <!-- ===== Left Sidebar ===== -->
    <aside class="sidebar">
        <h3>Categorías</h3>
        <ul>
            <li><a href="/productos/Ropa-de-Cama.html">Ropa de Cama</a>
                <ul>
                    <li><a href="/productos/Ropa-de-Cama/protectores-almohada.html">Protectores de Almohada</a></li>
                    <li><a href="/productos/Ropa-de-Cama/protectores-colchon.html">Protectores de Colchón</a></li>
                    <li><a href="#">Almohadas</a></li>
                    <li><a href="#">Sábanas</a></li>
                </ul>
            </li>
        </ul>
    </aside>

    <!-- ===== Main Content ===== -->
    <main class="content">

        <a class="back-link" href="/productos/Ropa-de-Cama/protectores-almohada.html">
            ← Volver a Protectores de Almohada
        </a>

        <div class="product">

            <!-- Image -->
            <img src="/images/protector-almohada-bambu.jpg" alt="Protector de Almohada Bambú">

            <!-- Info -->
            <div class="product-info">
                <h1>Protector de Almohada – Bambú</h1>

                <!-- Medida -->
                <div class="measure">
                    <label for="medida">Medida</label>
                    <select id="medida" name="medida">
                        <option value="">Seleccionar medida</option>
                        <option>Standard</option>
                        <option>Queen</option>
                        <option>King</option>
                    </select>
                </div>

                <!-- Cantidad -->
                <div class="measure">
                    <label for="cantidad">Cantidad</label>
                    <input type="number" id="cantidad" name="cantidad" value="1" min="1">
                </div>

                <a href="#" class="btn">Solicitar cotización</a>
            </div>

        </div>

    </main>

</div>

</body>
</html>
