<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>{{ page.title }} | {{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon.png">
  <link rel="apple-touch-icon" href="/images/favicon.png">
  <link rel="stylesheet" href="/assets/css/blog.css">
</head>
<body>
  <header class="site-header">
    <div class="site-header__inner">
      <a class="brand" href="/"><img class="brand__logo" src="/assets/images/logo-hs-unified.png" alt="Hotel Suministros"></a>
      <nav class="site-nav" aria-label="Navegación principal">
        <a href="/">Inicio</a>
        <a href="/productos.html">Productos</a>
        <a href="/blog/" {% if page.url == '/blog/' %}aria-current="page"{% endif %}>Blog</a>
        <a href="/quienes-somos.html">Quiénes Somos</a>
        <a href="/sostenibilidad.html">Sostenibilidad</a>
        <a href="/contacto.html">Contacto</a>
      </nav>
    </div>
  </header>
  <main>
    {{ content }}
  </main>
  <footer class="site-footer">© {{ 'now' | date: "%Y" }} Hotel Suministros. Soluciones para hoteles.</footer>
</body>
</html>
